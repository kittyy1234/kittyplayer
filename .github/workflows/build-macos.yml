name: Build KittyPlayer DMG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: KittyPlayer-dmg
          path: build/KittyPlayer.dmg
